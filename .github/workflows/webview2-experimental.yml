name: Printei oficial V8.55
on:
  push:
    branches: [main]
    paths-ignore: ['update.json', 'ui-update.json']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: printei-official-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows-auth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: app/go.sum
      - name: Testar armazenamento DPAPI no Windows
        working-directory: app
        run: go test ./...
  portable:
    needs: windows-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: app/go.sum
      - name: Testar o conector
        working-directory: app
        run: |
          go test -race printer_cloud.go printer_cloud_test.go
          node --check printer-cloud.js
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/printei.test.exe"
      - name: Definir versão da compilação
        shell: bash
        run: echo "BUILD_VERSION=8.55" >> "$GITHUB_ENV"
      - name: Compilar EXE portátil
        working-directory: app
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 logo.svg -o logo.png
          go install github.com/tc-hib/go-winres@v0.3.3
          "$(go env GOPATH)/bin/go-winres" simply --icon logo.png --manifest gui
          go mod download github.com/jchv/go-webview2
          dep="$(go list -m -f '{{.Dir}}' github.com/jchv/go-webview2)"
          cp -R "$dep" "$RUNNER_TEMP/printei-webview2"
          chmod -R u+w "$RUNNER_TEMP/printei-webview2"
          python3 - "$RUNNER_TEMP/printei-webview2/webview.go" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          original = "w32.User32ShowWindow.Call(w.hwnd, w32.SWShow)"
          assert source.count(original) == 1
          path.write_text(source.replace(original, "w32.User32ShowWindow.Call(w.hwnd, 3)"))
          PY
          go mod edit -replace=github.com/jchv/go-webview2="$RUNNER_TEMP/printei-webview2"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -X main.version=$BUILD_VERSION" -o Printei-V8.55-Portable.exe .
          sha256sum Printei-V8.55-Portable.exe > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Printei-V8.55-Portable
          path: |
            app/Printei-V8.55-Portable.exe
            app/SHA256.txt

      - name: Publicar atualização oficial
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$BUILD_VERSION"
          asset="Printei-V$BUILD_VERSION-Portable.exe"
          cp app/Printei-V8.55-Portable.exe "$asset"
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          if gh release view "$tag" >/dev/null 2>&1; then echo "Versão já publicada; aumente a versão para nova release."; exit 0; fi
          gh release create "$tag" "$asset" --target "$GITHUB_SHA" --latest --title "Printei V$BUILD_VERSION" --notes "Categoria de clientes Premium com acréscimo automático personalizável. Perfil oficial preservado."
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          export ASSET_SHA="$sha"
          python3 -c 'import json,os; v=os.environ["BUILD_VERSION"]; print(json.dumps({"version":v,"url":"https://github.com/Lawater13/Printei/releases/download/v"+v+"/Printei-V"+v+"-Portable.exe","sha256":os.environ["ASSET_SHA"]}))' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publicar manifesto oficial $BUILD_VERSION [skip ci]"
          git push origin HEAD:main
        