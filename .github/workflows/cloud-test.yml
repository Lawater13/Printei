name: Printei Cloud Teste
on:
  push:
    branches: [v8-cloud-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Compilar
        working-directory: app
        shell: pwsh
        run: go build -ldflags "-H=windowsgui -X main.version=8.0" -o ../Printei-Cloud-Teste.exe main.go
      - uses: actions/upload-artifact@v4
        with:
          name: Printei-Cloud-Teste
          path: Printei-Cloud-Teste.exe
      - name: Publicar prévia experimental
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v8.0-preview.3"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Printei V8.0 Experimental - Teste 3" --notes "Login e modo offline aprovados. Sincronização real ainda não disponível. Perfil de teste separado da versão oficial." Printei-Cloud-Teste.exe
          } else {
            gh release upload $tag Printei-Cloud-Teste.exe --clobber --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
