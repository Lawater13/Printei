name: Printei Cloud Teste
on:
  push:
    branches: [v8-cloud-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Compilar
        working-directory: app
        shell: pwsh
        run: go build -ldflags "-H=windowsgui -X main.version=8.0" -o ../Printei-Cloud-Teste.exe main.go
      - uses: actions/upload-artifact@v4
        with:
          name: Printei-Cloud-Teste
          path: Printei-Cloud-Teste.exe
